# ══════════════════════════════════════════════════════════════════════════════
# GitHub Actions — Build, Push Docker Image & Auto-Deploy
# ══════════════════════════════════════════════════════════════════════════════
#
# এই workflow main branch-এ push হলে automatically:
#   1. .NET tests run করবে
#   2. Docker image build করবে
#   3. GitHub Container Registry (GHCR)-এ push করবে
#   4. Production server-এ SSH করে নতুন image pull করে restart করবে
#
# ─── GitHub Secrets Setup ────────────────────────────────────────────────────
# GitHub → Repository → Settings → Secrets and variables → Actions → New secret
#
# Required secrets:
#   DOCKER_USERNAME        - GitHub username (lowercase)
#   DB_SA_PASSWORD         - SQL Server SA password
#   JWT_KEY                - JWT secret key (64+ chars)
#   EMAIL_USERNAME         - Gmail address
#   EMAIL_PASSWORD         - Gmail App Password
#   SSLCOMMERZ_STORE_ID    - SSLCommerz Store ID
#   SSLCOMMERZ_STORE_PASSWORD - SSLCommerz Store Password
#
# Optional (for VPS/SSH auto-deploy):
#   SSH_HOST               - Server IP address or domain
#   SSH_USER               - SSH username (e.g., ubuntu, root)
#   SSH_PRIVATE_KEY        - SSH private key (cat ~/.ssh/id_rsa)
#   SSH_PORT               - SSH port (default: 22)
# ══════════════════════════════════════════════════════════════════════════════

name: CI/CD — Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cattlefarm

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # Job 1: Test
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore CattleFarm.slnx

      - name: Build solution
        run: dotnet build CattleFarm.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CattleFarm.slnx --configuration Release --no-build --verbosity normal

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2: Build Docker Image & Push to GHCR
  # Only runs on push to main (not on PRs)
  # ══════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write  # Required to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with git SHA (e.g., sha-abc1234)
            type=sha,prefix=sha-,format=short
            # Tag with 'latest' on main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with branch name
            type=ref,event=branch

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      - name: Image build summary
        run: |
          echo "## 🐳 Docker Image Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3: Deploy to Production Server (SSH)
  # Only runs after successful image push
  # Requires SSH_HOST, SSH_USER, SSH_PRIVATE_KEY secrets to be set
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code (for docker-compose files)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            echo "🔄 Navigating to app directory..."
            cd ~/cattlefarm

            echo "🔑 Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "⬇️  Pulling latest Docker image..."
            docker compose -f docker-compose.prod.yml pull app

            echo "🚀 Restarting app with zero-downtime..."
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            docker compose -f docker-compose.prod.yml ps

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`${{ secrets.SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`" >> $GITHUB_STEP_SUMMARY
