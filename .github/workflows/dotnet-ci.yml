name: .NET CI (Pull Request Check)

# This workflow runs only on Pull Requests for quick feedback.
# Pushes to 'main' are handled by 'deploy.yml' which also runs tests.
on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: 🔍 Build & Test (PR Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore CattleFarm.slnx

      - name: Build
        run: dotnet build CattleFarm.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CattleFarm.slnx --configuration Release --no-build --verbosity normal
